[project]
name = "filesystem-rag-mcp"
version = "0.1.0"
description = "Local filesystem RAG MCP server: vector + full-text search over your files. Streamable HTTP + stdio, OAuth 2.1 with dynamic client registration."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Freya Jeffers", email = "fboniface@unr.edu"},
]
keywords = ["mcp", "rag", "filesystem", "vector-search", "full-text-search", "oauth", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: Text Processing :: Indexing",
]

# Runtime dependencies
dependencies = [
    # MCP SDK v2 — supports the 2026-07-28 spec and every earlier revision
    "mcp[cli]>=1.21.0",
    # ASGI server for Streamable HTTP transport
    "starlette>=0.41.0",
    "uvicorn[standard]>=0.32.0",
    # OAuth 2.1 server primitives
    "authlib>=1.3.2",
    # JWT issuance + audience/issuer validation (RFC 7519, RFC 9068-style)
    "pyjwt[crypto]>=2.9.0",
    # PKCE code-verifier generation
    "secrets-toolkit>=0.1.0 ; python_version < '3.12'",
    # Full-text search engine — embedded, zero-config, pure Python
    "whoosh>=2.7.4",
    # Vector store — embedded, zero-config
    "chromadb>=0.5.20",
    # Sentence-transformers for local embeddings (CPU-friendly default)
    "sentence-transformers>=3.3.0",
    # Pydantic for request/response schemas
    "pydantic>=2.9.0",
    # Structured logging
    "structlog>=24.4.0",
    # File-type detection for chunking heuristics
    "python-magic>=0.4.27",
    # Async file I/O
    "aiofiles>=24.1.0",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "pillow>=11.0.0",
    "pymupdf>=1.25.0",
    "python-docx>=1.1.0",
    "python-pptx>=1.0.0",
    "beautifulsoup4>=4.12.0",
    "striprtf>=0.0.26",
    "nbformat>=5.9.0",
    "ebooklib>=0.18",
    "mutagen>=1.47.0",
    "markitdown>=0.1.7",
    # Path security
    "pathvalidate>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
]

[project.scripts]
filesystem-rag-mcp = "filesystem_rag_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/freyajeffers/filesystem-rag-mcp"
Repository = "https://github.com/freyajeffers/filesystem-rag-mcp.git"
Issues = "https://github.com/freyajeffers/filesystem-rag-mcp/issues"
Changelog = "https://github.com/freyajeffers/filesystem-rag-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_rag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
    "S101",  # asserts in tests
    "E501",  # line length (handled by formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "N"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/filesystem_rag_mcp"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
