[project]
name = "filesystem-rag-mcp"
version = "0.1.0"
description = "Local filesystem RAG MCP server: vector + full-text search over your files. Streamable HTTP + stdio, OAuth 2.1 with dynamic client registration."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = {text = "MIT"}
authors = [
    {name = "Freya Jeffers", email = "fboniface@unr.edu"},
]
keywords = ["mcp", "rag", "filesystem", "vector-search", "full-text-search", "oauth", "model-context-protocol"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Filesystems",
    "Topic :: Text Processing :: Indexing",
]

# Runtime dependencies
# Pinned to the latest known release. Bump with `uv lock --upgrade` after
# verifying tests pass on the new resolution.
dependencies = [
    # MCP SDK v2 — supports the 2026-07-28 spec and every earlier revision
    "mcp[cli]>=2.2.0",
    # ASGI server for Streamable HTTP transport
    "starlette>=1.6.0",
    "uvicorn[standard]>=0.52.4",
    # OAuth 2.1 server primitives
    "authlib>=1.8.0",
    # JWT issuance + audience/issuer validation (RFC 7519, RFC 9068-style)
    "pyjwt[crypto]>=2.13.0",
    # Full-text search engine — embedded, zero-config, pure Python
    "whoosh>=2.7.4",
    # Vector store — embedded, zero-config
    "chromadb>=1.5.9",
    # Sentence-transformers for local embeddings (CPU-friendly default)
    "sentence-transformers>=6.0.1",
    # HuggingFace Hub client (transitive via sentence-transformers, used
    # directly by vector.Embedder to silence unauthenticated-request warnings).
    "huggingface_hub>=1.30.0",
    # Pydantic for request/response schemas
    "pydantic>=2.13.5",
    # Structured logging
    "structlog>=26.1.0",
    # File-type detection for chunking heuristics
    "python-magic>=0.4.27",
    # Async file I/O
    "aiofiles>=25.1.0",
    "defusedxml>=0.7.1",
    "openpyxl>=3.1.5",
    "pillow>=12.3.0",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "beautifulsoup4>=4.15.0",
    "striprtf>=0.0.33",
    "nbformat>=5.11.1",
    "ebooklib>=0.20",
    "mutagen>=1.48.1",
    "markitdown>=0.1.7",
    "watchfiles>=1.2.0",
    "flashrank>=0.2.10",
    # Path security
    "pathvalidate>=3.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.6",
    "mypy>=2.3.1",
    "httpx>=0.28.1",
    "anyio>=4.15.1",
]

[project.scripts]
filesystem-rag-mcp = "filesystem_rag_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/freyajeffers/filesystem-rag-mcp"
Repository = "https://github.com/freyajeffers/filesystem-rag-mcp.git"
Issues = "https://github.com/freyajeffers/filesystem-rag-mcp/issues"
Changelog = "https://github.com/freyajeffers/filesystem-rag-mcp/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filesystem_rag_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "S101",   # asserts in tests
    "E501",   # line length (handled by formatter)
    "B905",   # zip without strict= (for Python 3.10 compatibility)
    "ASYNC",  # async filesystem operations in local RAG are synchronous by design
    "S",      # security checks handled by safe_resolve and sandbox
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B", "N"]
"scripts/**" = ["S"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = [
    "whoosh.*",
    "flashrank.*",
    "openpyxl.*",
    "docx.*",
    "pptx.*",
    "striprtf.*",
    "ebooklib.*",
    "mutagen.*",
    "defusedxml.*",
    "magic.*",
    "bs4.*",
    "pathvalidate.*",
    "nbformat.*",
    "markitdown.*",
    "aiofiles.*",
    "sentence_transformers.*",
    "chromadb.*",
    "pymupdf.*",
    "fitz.*",
    "authlib.*",
]
ignore_missing_imports = true
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = [
    "mcp.*",
]
no_implicit_reexport = false

[[tool.mypy.overrides]]
module = "filesystem_rag_mcp.converter"
disallow_untyped_calls = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
]

[tool.coverage.run]
source = ["src/filesystem_rag_mcp"]
omit = ["*/tests/*", "*/__main__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
