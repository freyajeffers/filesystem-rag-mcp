name: CI

on:
  push:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/dependabot.yml"
  pull_request:
    branches: [ "main" ]
    paths-ignore:
      - "docs/**"
      - "**.md"
      - ".github/dependabot.yml"

# Cancel in-progress runs on the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege defaults. Individual jobs opt in to what they need.
permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # pyproject.toml requires-python = ">=3.11,<3.14"
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libmagic1 poppler-utils

      - name: Install project and dependencies
        run: uv sync --all-extras --dev

      - name: Lint and format check with ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Type check with mypy
        run: uv run mypy src

      - name: Cache HuggingFace models
        uses: actions/cache@v5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Verify doctor diagnostics
        run: uv run filesystem-rag-mcp --doctor

      - name: Smoke test CLI subcommands
        run: |
          set -euo pipefail
          CORPUS="$RUNNER_TEMP/ci-corpus"
          DATA="$RUNNER_TEMP/ci-data"
          mkdir -p "$CORPUS"
          cat > "$CORPUS/a.md" <<'EOF'
          # Hello
          RAG search combines full-text and vector retrieval.
          EOF
          cat > "$CORPUS/b.md" <<'EOF'
          # Notes
          Chunking and indexing share a chunk store.
          EOF

          # doctor: must report healthy
          uv run filesystem-rag-mcp doctor --json > /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert d['healthy'], d"

          # index (quick): must populate text index
          uv run filesystem-rag-mcp index \
              --root-dir "$CORPUS" --data-dir "$DATA" --json > /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert d['ok'] and d['chunks_indexed'] >= 2, d"

          # stats: must report non-zero text chunks
          uv run filesystem-rag-mcp stats \
              --root-dir "$CORPUS" --data-dir "$DATA" --json > /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert d['fulltext_chunks'] >= 2, d"

          # search: must return hits for our seed term
          uv run filesystem-rag-mcp search "vector retrieval" \
              --root-dir "$CORPUS" --data-dir "$DATA" --json > /tmp/out.json
          python -c "import json; d=json.load(open('/tmp/out.json')); assert isinstance(d, list) and len(d) >= 1, d"

      - name: Run test suite with coverage
        run: |
          uv run pytest -v \
            --cov=filesystem_rag_mcp \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=70

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v5
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          retention-days: 14