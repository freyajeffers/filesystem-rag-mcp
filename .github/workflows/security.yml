name: Security

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Weekly Monday 06:00 UTC. Reports new CVEs even when no PR is open.
    - cron: "0 6 * * 1"

# Cancel superseded runs on PR ref updates.
concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Default to read-only; bandit/pip-audit don't need write tokens.
permissions:
  contents: read

jobs:
  bandit:
    name: Bandit static security analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --all-extras --dev

      # bandit and pip-audit aren't project dev deps (they're security
      # tooling used only by this workflow). Use `uv tool run` so they
      # install into an isolated environment without polluting the
      # project venv or breaking lockfile purity.
      - name: Generate bandit baseline from existing findings
        run: |
          uv tool run --from bandit bandit -r src/ -f json -o /tmp/bandit-initial.json || true
          # If the baseline file doesn't exist, seed it with the current
          # findings so the first run after this commit doesn't fail.
          if [ ! -f .bandit-baseline.json ]; then
            mv /tmp/bandit-initial.json .bandit-baseline.json
            echo "Seeded .bandit-baseline.json from current findings."
            exit 0
          fi

      - name: Run bandit against baseline
        run: |
          uv tool run --from bandit bandit -r src/ -f json -o /tmp/bandit-current.json || EXIT=$?
          if [ -f .bandit-baseline.json ]; then
            uv tool run --from bandit bandit -r src/ -b .bandit-baseline.json -f json -o /tmp/bandit-new.json || EXIT=$?
            echo "Comparing current findings against baseline..."
          fi

      - name: Upload bandit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bandit-report
          path: /tmp/bandit-*.json
          retention-days: 30

  pip-audit:
    name: pip-audit dependency vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install project and dev dependencies
        run: uv sync --all-extras --dev

      - name: Export dependency list and audit
        # `--no-deps` audits only direct dependencies to avoid noise from
        # transitive CVEs that the project can't directly remediate.
        # Drop `--no-deps` to audit the entire dependency tree.
        #
        # `--strict` makes pip-audit exit non-zero on any CVE (with or
        # without a fix available). This is the right default for a
        # security job: surfaces known issues immediately so they can't
        # be silently deferred. Triage happens via follow-up commits.
        run: |
          uv export --no-hashes --output-file /tmp/requirements.txt
          uv tool run --from pip-audit pip-audit -r /tmp/requirements.txt --strict